<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PFI 3D Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap">
<style>
  :root{--ink:#141618;--panel:#1C1F22;--line:#3A3D40;--orange:#F37021;--orange-h:#FF8A3D;--light:#E9E6E1;--grey:#C9C5BE;--soft:#4A4D50;--card:#F1EFEB}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--card);color:var(--ink);font-family:Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
  .wrap{height:100%;display:flex;flex-direction:column}
  .bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;height:46px;padding:0 6px 0 14px;background:var(--ink)}
  .bar .eye{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--orange);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .modes{display:flex;gap:4px;flex:none}
  .mode{height:34px;padding:0 10px;border:1px solid var(--light);background:transparent;color:var(--light);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
  .mode:hover{border-color:var(--orange);color:var(--orange)}
  .mode[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:var(--ink)}
  .view{position:relative;flex:1;min-height:0;background:#E9E7E2;overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .badge{position:absolute;top:12px;left:12px;padding:8px 10px 7px;background:var(--ink);color:var(--light);pointer-events:none;max-width:calc(100% - 24px)}
  .badge .code{font-family:Anton,Impact,sans-serif;font-size:22px;line-height:1;letter-spacing:.01em}
  .badge .sub{font-size:10px;color:var(--grey);margin-top:4px;white-space:nowrap}
  .sel{position:absolute;top:12px;right:12px;max-width:180px;padding:7px 10px;background:var(--ink);color:var(--light);font-size:11px;pointer-events:none}
  .sel .cat{font-size:9px;color:var(--grey);letter-spacing:.12em;text-transform:uppercase}
  .sel .lbl{font-weight:600;margin-top:2px}
  .done{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--orange);color:var(--ink);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.18)}
  .foot{position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;pointer-events:none}
  .hint{padding:5px 8px;background:rgba(255,255,255,.92);font-size:10px;line-height:1.35;color:var(--soft)}
  .reset{pointer-events:auto;flex:none;width:32px;height:32px;display:grid;place-items:center;background:#fff;border:1px solid var(--grey);color:var(--ink)}
  .reset:hover{border-color:var(--ink)}
  .ctrl{flex:none;padding:12px 13px 10px;background:var(--card);border-top:1px solid #DCD8D2;min-height:84px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{height:30px;padding:0 10px;background:#fff;border:1px solid var(--grey);color:var(--ink);font-size:11px;font-weight:600;transition:background .15s,border-color .15s}
  .chip:hover{border-color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--orange);border-color:var(--ink)}
  .prog{display:flex;justify-content:space-between;font-size:11px;font-weight:600;margin-bottom:6px}
  .track{height:6px;background:#DCD8D2;overflow:hidden;margin-bottom:10px}
  .track i{display:block;height:100%;width:0;background:var(--orange);transition:width .25s}
  .acts{display:flex;gap:6px;flex-wrap:wrap}
  .act{height:30px;padding:0 10px;background:#fff;border:1px solid var(--ink);color:var(--ink);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .act.ghost{border-color:var(--grey)}
  .act:hover{background:var(--ink);color:var(--light)}
  [hidden]{display:none!important}
  @media (max-width:360px){.bar .eye .long,.mode .long{display:none}.bar{padding-left:10px}.bar .eye{font-size:9px;letter-spacing:.12em}.mode{padding:0 7px;font-size:9px}.chip{padding:0 8px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="eye"><span class="long">Interactive </span>3D model</div>
    <div class="modes" role="group" aria-label="Mode">
      <button type="button" class="mode" data-mode="configure" aria-pressed="true">Configure</button>
      <button type="button" class="mode" data-mode="build" aria-pressed="false">Build it<span class="long"> yourself</span></button>
    </div>
  </div>

  <div class="view" id="view">
    <canvas id="c" aria-label="3D model of a Pocket Form Isolator form. Drag to rotate."></canvas>
    <div class="badge"><div class="code" id="code">42SQ16</div><div class="sub" id="sub">42" &times; 42" plan &middot; 16" deep</div></div>
    <div class="sel" id="sel" hidden><div class="cat" id="selCat"></div><div class="lbl" id="selLbl"></div></div>
    <div class="done" id="done" role="status" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5 L9.5 18 L20 6"/></svg>
      Form complete
    </div>
    <div class="foot">
      <div class="hint" id="hint"></div>
      <button type="button" class="reset" id="reset" aria-label="Reset view" title="Reset view">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
    </div>
  </div>

  <div class="ctrl">
    <div class="chips" id="chips" role="group" aria-label="Shape"></div>
    <div id="buildCtl" hidden>
      <div class="prog"><span id="progTxt">0 of 0 parts placed</span><span id="progPct">0%</span></div>
      <div class="track" role="progressbar" aria-label="Parts placed" aria-valuemin="0" aria-valuemax="100" id="progBar"><i id="progFill"></i></div>
      <div class="acts">
        <button type="button" class="act" id="scatter">Take it apart</button>
        <button type="button" class="act ghost" id="solve">Snap all in place</button>
      </div>
    </div>
  </div>
</div>

<script src="engine.js"></script>
<script>
(function(){
  var ACCENT = '#F37021';
  var SHAPES = [['sq','Square'],['2q','2Q'],['3q','3Q'],['round','Round'],['half','Half round'],['quarter','Quarter'],['race','Racetrack']];
  var NAMES = {sq:'Square',  '1q':'1Q corner','2q':'2Q','3q':'3Q',round:'Round',half:'Half round',quarter:'Quarter round',race:'Racetrack'};
  var state = { mode:'configure', shape:'sq', info:null };
  var coarse = window.matchMedia && matchMedia('(hover: none) and (pointer: coarse)').matches;
  var $ = function(id){ return document.getElementById(id); };

  var chips = $('chips');
  SHAPES.forEach(function(s){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = s[1]; b.dataset.shape = s[0];
    b.setAttribute('aria-pressed', s[0] === state.shape ? 'true' : 'false');
    chips.appendChild(b);
  });

  var canvas = $('c');
  var viewer = window.PFI3D.create(canvas, { mode:'light', partColor:'#74787C', accent:ACCENT, onChange:function(info){ state.info = info; render(); } });
  viewer.set({ shape:'sq', a:42, b:42, depth:16 });
  viewer.setView({ view:'assembled', step:0, context:true, slab:false, dims:true, colorBy:false });

  // Page-friendly input: plain wheel scrolls the page; pinch / Ctrl+wheel zooms the model.
  var view = $('view');
  view.addEventListener('wheel', function(e){ viewer.controls.enableZoom = !!(e.ctrlKey || e.metaKey); }, { capture:true, passive:true });
  view.addEventListener('pointerdown', function(e){ viewer.controls.enableZoom = (e.pointerType === 'touch'); }, { capture:true });
  function touchMode(){ canvas.style.touchAction = state.mode === 'build' ? 'none' : 'pan-y'; }

  function render(){
    var info = state.info || viewer.info() || {};
    var build = state.mode === 'build';
    document.querySelectorAll('.mode').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.mode === state.mode ? 'true' : 'false'); });
    chips.querySelectorAll('.chip').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.shape === state.shape ? 'true' : 'false'); });
    if (build) {
      $('code').textContent = (info.placed || 0) + ' / ' + (info.total || 0);
      $('sub').textContent = 'parts placed';
    } else {
      $('code').textContent = info.code || NAMES[state.shape] || '';
      $('sub').textContent = info.plan ? (info.plan + ' plan · ' + info.depth + ' deep') : '';
    }
    var sel = !build && info.selected;
    $('sel').hidden = !sel;
    if (sel) { $('selCat').textContent = info.selected.catName || ''; $('selLbl').textContent = info.selected.label || ''; }
    $('done').hidden = !(build && info.complete);
    $('hint').textContent = build
      ? (coarse ? 'Drag a part into its outline · drag empty space to rotate' : 'Drag a part into its outline · drag empty space to rotate')
      : (coarse ? 'Swipe sideways to rotate · pinch to zoom · tap a part to name it' : 'Drag to rotate · pinch or Ctrl + scroll to zoom · click a part to name it');
    chips.hidden = build;
    $('buildCtl').hidden = !build;
    var pct = info.total ? Math.round(100 * (info.placed || 0) / info.total) : 0;
    $('progTxt').textContent = (info.placed || 0) + ' of ' + (info.total || 0) + ' parts placed';
    $('progPct').textContent = pct + '%';
    $('progFill').style.width = pct + '%';
    $('progBar').setAttribute('aria-valuenow', String(pct));
    touchMode();
  }

  document.addEventListener('click', function(e){
    var t = e.target.closest('button'); if (!t) return;
    if (t.dataset.mode) { state.mode = t.dataset.mode; viewer.setMode(state.mode); render(); }
    else if (t.dataset.shape) { state.shape = t.dataset.shape; viewer.set({ shape:state.shape }); viewer.setView({ step:0 }); render(); }
    else if (t.id === 'reset') viewer.resetView();
    else if (t.id === 'scatter') viewer.scatter();
    else if (t.id === 'solve') viewer.solve();
  });

  render();
})();
</script>
</body>
</html>
